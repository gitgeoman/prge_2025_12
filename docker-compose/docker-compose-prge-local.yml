x-environment:
  #DB
  - &env-postgres-db POSTGRES_DB=${POSTGRES_DB:?}
  - &env-postgres-user POSTGRES_USER=${POSTGRES_USER:?}
  - &env-postgres-password POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
  - &env-postgres-port POSTGRES_PORT=${POSTGRES_PORT:?}
  # GeoServer
  - &env-geoserver-user GEOSERVER_ADMIN_USER=${POSTGRES_USER:?}
  - &env-geoserver-pass GEOSERVER_ADMIN_PASSWORD=${POSTGRES_PASSWORD:?}
  # Minio
  - &env-minio-user MINIO_ROOT_USER=${MINIO_ROOT_USER:?}
  - &env-minio-pass MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?}



services:
  postgis:
    build:
      context: ..
      dockerfile: docker/postgis/Dockerfile
    image: 'prge_2025_postgis'
    container_name: 'prge_2025_postgis'
    environment:
      - *env-postgres-db
      - *env-postgres-user
      - *env-postgres-password
    ports:
      - 5443:5432
    volumes:
      - postgis-prge-2025-data:/var/lib/postgresql/data

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: prge_2025_minio
    restart: unless-stopped
    environment:
      - *env-minio-user
      - *env-minio-pass
      - MINIO_API_PORT_NUMBER=9000
      - MINIO_CONSOLE_PORT_NUMBER=9001
      - MINIO_BROWSER=on
      - MINIO_BROWSER_REDIRECT_URL=http://localhost:9002
    ports:
      - "9001:9000"  # S3 API
      - "9002:9001"  # Panel administracyjny
    volumes:
      - minio-prge-2025-data:/bitnami/minio/data

  geoserver:
    build:
      context: ..
      dockerfile: docker/geoserver/Dockerfile
    image: 'prge_2025_geoserver'
    container_name: 'prge_2025_geoserver'
    environment:
      - SKIP_DEMO_DATA=true
      - EXTRA_JAVA_OPTS=-DALLOW_ENV_PARAMETRIZATION=true -Ds3.properties.location=/opt/geoserver/data_dir/s3.properties
      - *env-postgres-db
      - *env-postgres-user
      - *env-postgres-password
      - *env-geoserver-user
      - *env-geoserver-pass
      - *env-postgres-port
    ports:
      - 8500:8080
    volumes:
      - ../.tmp/data:/opt/geoserver_data
      - ../.tmp/geoserver-config:/opt/geoserver/data_dir

  fastapi:
    build:
      context: ..
      dockerfile: docker/fastapi/Dockerfile
    image: 'prge_2025_fastapi'
    container_name: 'prge_2025_fastapi'
    environment:
      - *env-postgres-db
      - *env-postgres-user
      - *env-postgres-password
    ports:
      - 10000:10000


  node:
    build:
      context: ..
      dockerfile: docker/node/Dockerfile
    image: 'prge_2025_node'
    container_name: 'prge_2025_node'
    volumes:
      - ../config/node/frontend/src:/app/src
      - ../config/node/frontend/package.json:/app/package.json
      - ../config/node/frontend/package-lock.json:/app/package-lock.json
    ports:
      - 3000:3000
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true


  nginx:
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile_local
    image: 'prge_2025_nginx'
    container_name: 'prge_2025_nginx'
    ports:
      - 8090:80


volumes:
  postgis-prge-2025-data:
  minio-prge-2025-data: